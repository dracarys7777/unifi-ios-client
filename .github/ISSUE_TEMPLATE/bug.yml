name: Bug report
description: Reproducible behavior to investigate
title: "[bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result, actual result
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: App build and iOS version
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Never include credentials, private prompts, or personal attachments.
