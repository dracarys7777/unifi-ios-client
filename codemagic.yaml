workflows:
  ios-checks:
    name: unifi simulator checks
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Simulator tests
        script: bash scripts/check-ios.sh
    artifacts:
      - build/Tests.xcresult
  ios-beta:
    name: unifi manual TestFlight beta
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: unifi-appstore
    environment:
      xcode: latest
      groups:
        - unifi_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.suhasmallya.unifi
    scripts:
      - name: Check source before adding release configuration
        script: bash scripts/check-ios.sh
      - name: Prepare Firebase configuration
        script: python3 scripts/prepare_firebase.py
      - name: Generate project and configure signing
        script: |
          xcodegen generate
          xcode-project use-profiles
      - name: Archive and export
        script: |
          xcode-project build-ipa --project Unifi.xcodeproj --scheme Unifi --archive-flags="CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/Tests.xcresult
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal testers
